<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#f4f6fa"/><style>text{font-family:Arial,sans-serif;fill:#203047} .title{font-size:26px;font-weight:bold}.label{font-size:19px}.small{font-size:15px}</style><text x="40" y="45" class="title">AutoRent — архитектура лабораторной 8</text><rect x="40" y="75" width="920" height="105" rx="16" fill="#d6f0e8"/><text x="65" y="110" class="label">Клиенты: Streamlit • Swagger • 3D-шоурум</text><text x="65" y="150" class="small">HTTP + JSON → GET / POST / PUT / PATCH / DELETE</text><text x="490" y="210" class="title">↓</text><rect x="40" y="225" width="920" height="130" rx="16" fill="#e0e2fb"/><text x="65" y="260" class="label">FastAPI: маршруты + Pydantic + HTTP Basic + роли</text><text x="65" y="300" class="small">Публичный каталог | вход для клиентов и аренды | admin для изменений</text><text x="65" y="330" class="small">Пароли: отдельный users.json с PBKDF2-хешами и солью</text><text x="490" y="390" class="title">↓</text><rect x="40" y="405" width="920" height="100" rx="16" fill="#ffedcf"/><text x="65" y="442" class="label">SQLModel Session → SQLite</text><text x="65" y="478" class="small">Category → Car → Rental ← Client • транзакции • FK • UNIQUE • CHECK</text><rect x="40" y="535" width="920" height="80" rx="16" fill="#dce7f5"/><text x="65" y="570" class="label">Контроль качества: pytest + requests + Locust + Bandit</text><text x="65" y="600" class="small">Git push → GitHub Actions → тесты / аудит / Compose config → артефакты</text></svg>